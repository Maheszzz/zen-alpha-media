<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>ZenAlpha Media | Digital Marketing Agency in Chennai – Google Ads, Meta Ads, SEO & Web Development</title>
    <meta name="description" content="ZenAlpha Media is a results-driven digital marketing agency in Chennai, India. We specialise in Google Ads, Meta Ads (Facebook & Instagram), SEO, and high-converting web development to deliver measurable revenue growth for 200+ brands." />
    <meta name="keywords" content="digital marketing agency Chennai, Google Ads management India, Meta Ads agency, Facebook Ads, Instagram Ads, performance marketing, SEO services Chennai, web development agency India, PPC management, lead generation, online advertising, growth marketing" />
    <meta name="author" content="ZenAlpha Media" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://zenalphamedia.com/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#E30613" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZenAlpha Media" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://zenalphamedia.com/" />
    <meta property="og:title" content="ZenAlpha Media | Performance Marketing Agency in Chennai, India" />
    <meta property="og:description" content="Data-driven Google Ads, Meta Ads, SEO, and web development that delivers measurable revenue growth. Trusted by 200+ brands across India." />
    <meta property="og:image" content="https://zenalphamedia.com/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZenAlpha Media | Performance Marketing Agency in Chennai" />
    <meta name="twitter:description" content="Results-driven digital marketing — Google Ads, Meta Ads, SEO & web development. 200+ brands scaled across India." />
    <meta name="twitter:image" content="https://zenalphamedia.com/logo.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ZenAlpha Media",
      "url": "https://zenalphamedia.com",
      "logo": "https://zenalphamedia.com/logo.png",
      "description": "Results-driven digital marketing agency specialising in Google Ads, Meta Ads, SEO, and web development in Chennai, India.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Chennai",
        "addressRegion": "Tamil Nadu",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@zenalphamedia.com",
        "contactType": "sales",
        "availableLanguage": ["English", "Tamil", "Hindi"]
      },
      "sameAs": [],
      "foundingDate": "2021",
      "numberOfEmployees": {
        "@type": "QuantitativeValue",
        "minValue": 10,
        "maxValue": 50
      },
      "knowsAbout": ["Google Ads", "Meta Advertising", "SEO", "Web Development", "Performance Marketing", "Digital Marketing"]
    }
    </script>

    <!-- Structured Data: WebSite (for sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ZenAlpha Media",
      "url": "https://zenalphamedia.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://zenalphamedia.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
